# Nginx 站点配置（作为 /etc/nginx/conf.d/default.conf 放入前端镜像）
# 作用：托管前端静态文件 + 把 /api 反代到后端容器
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 大文件上传（需 >= 后端 UPLOAD_MAX_FILE_SIZE，默认 10GB）
    client_max_body_size 10g;

    # 前端单页应用：找不到的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代（backend 为 compose 服务名）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 流式对话必须关闭缓冲，否则回答会「攒着一次性返回」
        proxy_buffering off;
        proxy_cache off;

        # 大文件上传 / 长耗时任务
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
