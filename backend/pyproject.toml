[project]
name = "vector-data-manager"
version = "0.1.0"
description = "Production-grade vector database management tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.36.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "markdown-it-py>=3.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",        # PostgreSQL 异步驱动（唯一支持的数据库）
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    # 多格式文档解析扩展
    "python-pptx>=0.6.23",       # PPT/PPTX 解析
    "xlrd==1.2.0",                # .xls 旧版 Excel 解析（1.2.0 支持 xls）
    "docx2txt>=0.8",              # .doc 旧版 Word 文本提取
    "olefile>=0.47",               # .doc OLE 文件结构读取（兜底方案）
    "redis[hiredis]>=5.0.0",      # Redis 缓存与会话热存储
    "beautifulsoup4>=4.12.0",     # HTML 解析
    "lxml>=4.9.0",                # HTML/XML 解析引擎
    "Pillow>=10.0.0",             # 图片处理
    # OCR（推荐 rapidocr-onnxruntime，纯离线、中文好，无需系统依赖）
    "rapidocr-onnxruntime>=1.3.0",
    "pytesseract>=0.3.10",        # Tesseract OCR 封装（可选，需系统装 Tesseract）
    # 视频处理（可选）
    "moviepy>=1.0.3",             # 视频抽帧（可选）
    "opencv-python>=4.8.0",       # OpenCV 视频抽帧（可选）
    # 音频/语音识别（可选）
    "faster-whisper>=1.0.0",      # 推荐 ASR（更快更省内存，支持 VAD）
    "openai-whisper>=20231117",   # 备选 ASR（OpenAI 官方）
    # 表格数据处理与切片
    "duckdb>=1.0.0",                # DuckDB：极速分析引擎，支持直接查询 Excel/CSV
    "pandas>=2.0.0",                 # 表格数据处理（DuckDB 配套）
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "aiosmtplib>=5.1.3",
]

[project.scripts]
vdm = "app.main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
