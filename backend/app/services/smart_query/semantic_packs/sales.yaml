# =============================================================
# 业务语义包：销售行业（默认）
# -------------------------------------------------------------
# 此文件定义了销售行业的业务语义配置，包括：
#   - 层级维度（hierarchy）：销售组织的层级结构
#   - 列名同义词（column_aliases）：同一维度的不同叫法
#   - 查询意图关键词（intent_keywords）：识别用户查询意图
#
# 新增行业时，复制此文件为 {industry}.yaml，
# 修改内容后，在 SchemaProvider 初始化时指定 industry 参数即可。
# =============================================================

# -------------------------------------------------------------
# 层级维度（从高到低的层级结构）
# key: 层级名称（标准名）
# value: 层级级别（数字越小级别越高）
# -------------------------------------------------------------
hierarchy_levels:
  "销售总监": 0
  "特区经理": 1
  "区域经理": 1
  "大区经理": 1
  "大区": 2
  "区域": 2
  "销售区域": 2
  "公司": 3
  "营销公司": 3
  "分公司": 3
  "办事处": 3
  "业务员": 4
  "销售人员": 4
  "销售代表": 4
  "客户": 5
  "客商": 5
  "客户名称": 5

# -------------------------------------------------------------
# 列名同义词 / 别名
# key: 标准列名
# value: 该列的所有别名（包括标准名本身）
# -------------------------------------------------------------
column_aliases:
  "销售总监":
    - "总监"
    - "销售总监"
    - "负责人"
    - "领导"
    - "老大"
    - "老板"
  "特区经理":
    - "经理"
    - "特区经理"
    - "区域经理"
    - "主管"
  "销售经理":
    - "销售经理"
    - "客户经理"
    - "销售人员"
    - "销售代表"
    - "销售"
    - "人员"
    - "业务员"
    - "销售员"
    - "经理"
  "大区":
    - "大区"
    - "区域"
    - "销售大区"
    - "销售区域"
  "营销公司":
    - "公司"
    - "营销公司"
    - "分公司"
    - "办事处"
  "业务员":
    - "业务员"
    - "销售人员"
    - "销售代表"
    - "销售"
    - "人员"
  "客户":
    - "客户"
    - "客商"
    - "客户名称"
    - "客户公司"
  "公司名称":
    - "公司"
    - "公司名称"
    - "企业名称"
    - "单位"
  "库存组织":
    - "库存组织"
    - "仓库"
    - "库存"
  "合同类型":
    - "合同类型"
    - "合同"
  "要货日期":
    - "要货日期"
    - "下单日期"
    - "订单日期"
  "发货日期":
    - "发货日期"
    - "出货日期"
    - "送货日期"

# -------------------------------------------------------------
# 查询意图关键词
# 用于识别用户查询的意图类型
# -------------------------------------------------------------
intent_keywords:
  count:
    - "多少"
    - "几个"
    - "数量"
    - "总数"
    - "总计"
    - "合计"
    - "统计"
    - "有多少"
    - "多少个"
    - "多少人"
    - "多少名"
    - "共多少"
    - "总共有"
  list:
    - "有哪些"
    - "哪些"
    - "列出"
    - "列表"
    - "名单"
    - "明细"
    - "详情"
    - "分别是"
    - "都是谁"
    - "都有谁"
    - "包括哪些"
    - "包含哪些"
  group:
    - "每个"
    - "各个"
    - "分别"
    - "按"
    - "分组"
    - "每个...多少"
    - "各有多少"
  top:
    - "top"
    - "前"
    - "排名"
    - "最高"
    - "最多"
    - "最大"
    - "第一名"
    - "前三"
    - "前十"
    - "前10"
    - "前20"
