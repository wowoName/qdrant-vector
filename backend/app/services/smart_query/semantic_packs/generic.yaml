# =============================================================
# 业务语义包：通用行业（默认兜底）
# -------------------------------------------------------------
# 不包含特定行业的业务术语，只有最通用的查询意图关键词。
# 适用于未指定行业、或者新行业还没有专属语义包的场景。
# =============================================================

# -------------------------------------------------------------
# 层级维度（通用行业通常没有销售行业那种强层级，留空）
# -------------------------------------------------------------
hierarchy_levels: {}

# -------------------------------------------------------------
# 列名同义词（通用别名）
# -------------------------------------------------------------
column_aliases:
  "日期":
    - "日期"
    - "时间"
    - "日期时间"
    - "创建时间"
    - "更新时间"
  "名称":
    - "名称"
    - "名字"
    - "姓名"
    - "标题"
  "数量":
    - "数量"
    - "个数"
    - "数目"
  "金额":
    - "金额"
    - "价格"
    - "费用"
    - "总额"

# -------------------------------------------------------------
# 查询意图关键词（通用）
# -------------------------------------------------------------
intent_keywords:
  count:
    - "多少"
    - "几个"
    - "数量"
    - "总数"
    - "总计"
    - "合计"
    - "统计"
    - "有多少"
    - "多少个"
    - "多少人"
    - "共多少"
    - "总共有"
  list:
    - "有哪些"
    - "哪些"
    - "列出"
    - "列表"
    - "明细"
    - "详情"
    - "分别是"
    - "包括哪些"
    - "包含哪些"
  group:
    - "每个"
    - "各个"
    - "分别"
    - "按"
    - "分组"
    - "各有多少"
  top:
    - "top"
    - "前"
    - "排名"
    - "最高"
    - "最多"
    - "最大"
    - "第一名"
    - "前三"
    - "前十"
